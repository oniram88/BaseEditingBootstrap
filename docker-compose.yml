services:
  app:
    command: /app/spec/dummy/bin/dev
    build:
      context: .
#      args:
#        RUBY_VERSION: "3.2"
    user: ${CMPS_UID_GID}
    volumes:
      - '.:/app'
      - 'bundle:/bundle'
      - '~/.gitconfig:/home/nobody/.gitconfig'
      - '~/.gnupg:/home/nobody/.gnupg'
      - '~/.gem:/home/nobody/.gem'
      - '~/.ssh:/home/nobody/.ssh'
    environment:
      RAILS_ENV: development
#      RAILS_VERSION: "8.0.0"
    ports:
      - 3000:3000

volumes:
  bundle: